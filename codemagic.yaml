workflows:
  snowbored:
    name: SnowBored APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Create Android project files
        script: flutter create --platforms=android --project-name snowbored .
      - name: App name and icon
        script: |
          sed -i.bak 's/android:label="[^"]*"/android:label="SnowBored"/' android/app/src/main/AndroidManifest.xml
          RES=android/app/src/main/res
          mkdir -p $RES/drawable $RES/mipmap-anydpi-v26
          cat > $RES/mipmap-anydpi-v26/ic_launcher.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_bg"/>
            <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          XML
          cat > $RES/drawable/ic_bg.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#5E9BEA" android:pathData="M0,0 H108 V36 H0 Z"/>
            <path android:fillColor="#7FB2F0" android:pathData="M0,36 H108 V64 H0 Z"/>
            <path android:fillColor="#A9CCF6" android:pathData="M0,64 H108 V108 H0 Z"/>
            <path android:fillColor="#FFF3B0" android:pathData="M78,24 a7,7 0 1 0 14,0 a7,7 0 1 0 -14,0 z"/>
            <path android:fillColor="#E9F2FF" android:pathData="M-6,108 L6,86 L22,70 L40,88 L66,50 L92,78 L104,70 L116,108 Z"/>
            <path android:fillColor="#BCD0EE" android:pathData="M66,50 L92,78 L104,70 L116,108 L84,108 L74,78 Z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M66,50 L58,64 L64,61 L69,67 L74,60 L80,66 Z"/>
            <path android:fillColor="#F7FAFF" android:pathData="M0,108 L0,92 L26,96 L58,102 L108,94 L108,108 Z"/>
          </vector>
          XML
          cat > $RES/drawable/ic_fg.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <group android:scaleX="0.8" android:scaleY="0.8" android:pivotX="54" android:pivotY="54" android:translateY="2">
              <path android:fillColor="#402B3A6A" android:pathData="M40,96 a15,2.4 0 1 0 30,0 a15,2.4 0 1 0 -30,0 z"/>
              <path android:fillColor="#2F7A47" android:pathData="M22,84 L17,94 L27,94 Z M22,89 L15,99 L29,99 Z"/>
              <path android:fillColor="#6B4423" android:pathData="M21,99 h2 v3 h-2 z"/>
              <path android:strokeColor="#CCFFFFFF" android:strokeWidth="1.4" android:strokeLineCap="round" android:fillColor="#00000000" android:pathData="M14,66 Q22,62 30,60 M12,72 Q20,69 27,67 M16,78 Q22,76 28,74"/>
              <path android:fillColor="#FFFFFF" android:pathData="M30,54 a1.6,1.6 0 1 0 3.2,0 a1.6,1.6 0 1 0 -3.2,0 z M22,48 a1.2,1.2 0 1 0 2.4,0 a1.2,1.2 0 1 0 -2.4,0 z M36,62 a1.1,1.1 0 1 0 2.2,0 a1.1,1.1 0 1 0 -2.2,0 z M92,36 a1.4,1.4 0 1 0 2.8,0 a1.4,1.4 0 1 0 -2.8,0 z"/>
              <group android:rotation="-24" android:pivotX="56" android:pivotY="52">
                <path android:fillColor="#F4B820" android:strokeColor="#8A5A00" android:strokeWidth="1.2" android:strokeLineJoin="round" android:pathData="M22,47 h68 a5,5 0 0 1 0,10 h-68 a5,5 0 0 1 0,-10 z"/>
                <path android:fillColor="#E8302C" android:pathData="M34,49.5 h44 v5 h-44 z"/>
                <path android:fillColor="#FFFFFF" android:pathData="M38,51.2 h8 v1.6 h-8 z M52,51.2 h8 v1.6 h-8 z M66,51.2 h8 v1.6 h-8 z"/>
                <path android:fillColor="#2B2F3A" android:pathData="M38,45 h12 v14 h-12 z M62,45 h12 v14 h-12 z"/>
                <path android:fillColor="#5A606C" android:pathData="M40,47 h8 v10 h-8 z M64,47 h8 v10 h-8 z"/>
                <path android:fillColor="#FFFFFF" android:pathData="M24,48.4 h60 v1 h-60 z"/>
              </group>
              <path android:strokeColor="#CCFFFFFF" android:strokeWidth="1.2" android:strokeLineCap="round" android:pathData="M78,74 L84,78 M70,78 L74,84 M84,66 L92,68"/>
            </group>
          </vector>
          XML
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
